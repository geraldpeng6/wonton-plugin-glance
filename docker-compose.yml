# Glance 信息面板：一个页面看天气、日历、时钟、新闻和 RSS。
# 上游 glanceapp/glance，AGPL-3.0-only，镜像按清单列表（index）的摘要固定。
#
# glance 只有文件配置，没有网页设置页：数据目录就是它的配置目录（容器里 /app/config），
# 主人或 Agent 改里面的 glance.yml 和 widgets/ 就能换部件；glance 检测到文件变化会自动重载，
# 检测不可用（inotify 受限）时在详情页停止再启动也一样。
# 包里的默认配置由一次性服务在首次安装时复制进数据目录，已有不覆盖，用户和 Agent 改过的才能留下。
# 天气部件（widgets/weather.yml）跟“天气城市”设置联动：init 每次创建容器时重新生成，
# 城市为空就只写一行注释，glance 里没有天气部件；城市值经 glance 的 ${ENV} 替换注入，见 glance 服务。
services:
  init:
    image: glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    user: "${PUID}:${PGID}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /data/widgets &&
        { test -f /data/glance.yml || cp /seed/glance.yml /data/glance.yml; } &&
        if [ -n "$$WEATHER_CITY" ]; then
        printf -- '- type: weather\n  units: $${GLANCE_WEATHER_UNITS}\n  hour-format: $${GLANCE_WEATHER_HOUR_FORMAT}\n  location: $${GLANCE_WEATHER_CITY}\n' > /data/widgets/weather.yml;
        else
        printf '# 设置里没有天气城市，不显示天气部件。\n' > /data/widgets/weather.yml;
        fi
    environment:
      WEATHER_CITY: ${WONTON_SETTING_CITY:-}
    volumes:
      - ${WONTON_APP_DATA}:/data
    configs:
      - source: glance-config
        target: /seed/glance.yml
    network_mode: none
    restart: "no"

  glance:
    image: glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      # 设置值经 glance 的 ${ENV} 配置替换进页面：weather.yml 引用 GLANCE_WEATHER_*，
      # 首页的时钟引用 GLANCE_HOUR_FORMAT。设置变化会重建容器，新值随之生效。
      GLANCE_WEATHER_CITY: ${WONTON_SETTING_CITY:-}
      GLANCE_WEATHER_UNITS: ${WONTON_SETTING_UNITS:-metric}
      GLANCE_WEATHER_HOUR_FORMAT: ${WONTON_SETTING_HOUR_FORMAT:-24h}
      GLANCE_HOUR_FORMAT: ${WONTON_SETTING_HOUR_FORMAT:-24h}
    volumes:
      - ${WONTON_APP_DATA}:/app/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

configs:
  glance-config:
    file: ./glance.yml

x-wonton:
  spec: "0.12"
  id: app.github.glanceapp.glance
  version: 0.1.0
  kind: app
  title: { zh: 信息面板（Glance）, en: Glance }
  description:
    zh: 把天气、日历、新闻和 RSS 放进一个页面
    en: "Weather, calendar, news and RSS on one page"
  icon: icon.png
  notices: [NOTICE]
  screenshots: [screenshots/home.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://github.com/glanceapp/glance
  # 应用（Glance）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: AGPL-3.0-only
  tags:
    zh: [信息面板, 天气, RSS]
    en: [Dashboard, Weather, RSS]
  about:
    zh: |
      一块信息面板：打开一个页面就能看到天气、日历、时间、新闻和 RSS 订阅，像钉在墙上的留言板。打开就用，不用注册登录。

      页面上放什么由你定：详情页的设置里改天气城市；想换别的（股票、监控、待办……）就改数据目录里的配置文件，上百种部件见上游文档。
    en: |
      An information dashboard: weather, calendar, clock, news and RSS feeds on a single page, like a board on the wall. Open and use, no account needed.

      You decide what's on it: change the weather city in the plugin's settings, or edit the config files in the data directory to swap in other widgets (markets, monitors, todos…); see the upstream docs for all options.
  release_notes: { zh: 第一版。, en: First release. }
  webui:
    service: glance
    port: 8080
    # glance 默认没有用户体系；网页始终在云吞网关的登录后面，不再另设账号。
    sso: none
  tabs:
    - id: home
      title: { zh: 面板, en: Glance }
      icon: tabs/home.svg
      icon_selected: tabs/home-fill.svg
      path: /
  settings: settings.schema.json
  permissions:
    # 天气（open-meteo）、RSS 源、Hacker News、GitHub 接口都要出网。
    - network.egress
  # 上游镜像 amd64 和 arm64 都有（清单列表另有 armv7，不列）；上游没写最低内存，
  # 本机空闲实测约 60M，取 256M 留余量。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
